n4c:{say:"Só para eu te ajudar do jeito certo: houve agressão ou violência (física, ameaça, perseguição), ou foi mais um conflito comum que te afetou?",opts:[{t:"Agressão ou violência",go:"n4r"},{t:"Humilhação ou injustiça, sem violência",do:L=>{L.tipo=/Chefe|Colegas|Escola|Trabalho/i.test(L.area)?TIPO[2]:TIPO[1]},go:"n4s"},{t:"Um conflito comum que me afetou",do:L=>{L.tipo=TIPO[1]},go:"n4s"},{t:"Não sei",do:L=>{L.tipo=TIPO[1]},go:"n4s"}]},
n4s:{say:"Entendi. Então vamos olhar para o que aconteceu e também para o que isso despertou em você.",jump:()=>"n5"},
n4r:{say:"Entendi. Quero deixar uma coisa clara: o que fizeram com você não é culpa sua. Vamos olhar para o que aconteceu e para como você pode se proteger. Se você corre perigo agora: Polícia 190 · Central de Atendimento à Mulher 180 · SAMU 192. Se quiser, também olhamos para o que isso despertou em você.",opts:[{t:"Entendi",go:"n5"}]},
n5:{say:"Combinado. Agora vamos entender como você costuma reagir.",end:1}};
SC[2]={start:"x",
x:{jump:()=>onlyReal()?"r0":(L.seta[0].trim()?"e1":"a0")},
r0:{say:"Como você se sentiu, e o que passou pela sua cabeça quando isso aconteceu?",ask:AK("Ex.: senti medo e vergonha",(L,v)=>{L.seta[0]=v},"r1",{loose:1,help:"r0h",pre:L=>L.seta[0]})},
r0h:{say:"Sem pressa. Escolha o que mais se parece com o que você sentiu:",opts:["Medo","Vergonha","Raiva","Tristeza","Impotência"].map(t=>({t,do:L=>{L.seta[0]="Senti "+t.toLowerCase()},go:"r1"}))},
r1:{say:"Obrigado por contar. Depois de algo assim, é comum a gente duvidar de si mesmo. Você sente que a culpa pode ser sua?",opts:[{t:"Não",go:"r2"},{t:"Um pouco",go:"r1c"},{t:"Não sei",go:"r1b"}]},
r1b:{say:"Entendo a dúvida; é comum a gente se culpar. Mas quem agride, humilha ou desrespeita é quem responde pelo que fez. Você não provocou isso por ser quem é.",jump:()=>"r2"},
r1c:{say:"Entendo. Pode ser que você tenha tido uma parte na situação. Mesmo assim, quem agride, humilha ou desrespeita responde pelo que fez. Vamos olhar o seu papel e o do outro separadamente, sem misturar.",jump:()=>"r2"},
r2:{say:"Certo. Vamos seguir.",end:1},
a0:{say:"Vamos olhar mais fundo. Qual foi o primeiro pensamento que passou pela sua cabeça?",ask:AK("Ex.: não adianta tentar, não vou terminar",(L,v)=>{L.seta[0]=v},"e1",{loose:1,help:"a0h",pre:L=>L.seta[0]})},
a0h:{say:"Sem pressa. Escolha o que mais se parece com o seu pensamento e ajuste depois:",opts:["Não adianta tentar…","Eu não vou conseguir…","Ninguém se importa comigo…","Eu sempre estrago tudo…","Vão me rejeitar…","Eu sou um fracasso…"].map(t=>({t,do:L=>{L.seta[0]=t},go:"a0c"}))},
a0c:{say:"Complete com suas palavras:",ask:AK("",(L,v)=>{L.seta[0]=v},"e1",{loose:1,pre:L=>L.seta[0]})},
e1:{say:L=>"Você pensou: “"+pens(cl(L.seta[0]))+"”. Teve alguma vez, mesmo pequena, em que isso não foi verdade?",opts:[{t:"Sim, teve",go:"e1y"},{t:"Não, nunca",go:"e1n"},{t:"Não sei o que dizer",go:"e1n"}]},
e1y:{say:"Que bom lembrar disso. O que aconteceu nessa vez?",ask:AK(()=>isSelf()?"Ex.: terminei um curso, resolvi um problema…":"Ex.: uma vez em que deu certo, ou alguém mostrou carinho…",(L,v)=>{L.evid.push(v)},"e2",{help:"e1h"})},
e1h:{say:()=>isSelf()?"Pense em algo pequeno, de qualquer época: algo que você começou e terminou, uma prova, um favor, uma tarefa.":"Pense em algo pequeno, de qualquer época: uma vez em que alguém demonstrou carinho, ou em que as coisas deram certo.",ask:AK("",(L,v)=>{L.evid.push(v)},"e2")},
e1n:{say:()=>isSelf()?"Pense com calma: algo pequeno, de qualquer época. Algo que você começou e terminou, ou que deu certo?":"Pense com calma: uma vez, mesmo pequena, em que alguém demonstrou carinho por você, ou em que as coisas deram certo.",opts:[{t:"Lembrei de uma",go:"e1y"},{t:"Realmente não lembro",go:"e1x"}]},
e1x:{say:"Tudo bem. Quando estamos mal, a mente costuma esconder os acertos. Vamos seguir e voltar a isso depois.",jump:()=>"a1j"},
e2:{say:L=>{const u=L.evid.length?cl(L.evid[L.evid.length-1]):"";return "Viu? É exatamente isso que você precisa entender."+(u?"\n“"+u+"” aconteceu de verdade.":"")+"\nVocê tem pontos positivos que são reais. Guarde isso como algo verdadeiro, que vai ser usado a seu favor."},jump:()=>"a1j"},
a1j:{jump:()=>isCore(L.seta[0])?"a4c":"a2"},
a2:{say:L=>"Agora, um passo mais fundo.\nVocê pensou: “"+pens(cl(L.seta[0]))+"”.\nSe isso for verdade, o que isso significa sobre você?\n\nEstou perguntando não sobre a situação, e sim sobre a conclusão que você tira sobre si mesmo(a) por pensar assim. Marque a que mais se aproxima:",opts:()=>[...(["Chefe / tarefa","Minha limitação","Medo ou fobia"].includes(L.area)?["Que sou fraco(a) ou incapaz","Que sou um fracasso","Que não presto","Que não mereço coisas boas","Que sou um peso para os outros"]:["Que não sou amado(a)","Que vão me rejeitar","Que vou ficar sozinho(a)","Que não presto","Que sou um fracasso"]).map(t=>({t,do:L=>{L.seta[1]=t},go:"a3"})),{t:"Outra: escrever com minhas palavras",go:"a2w"}]},
a2w:{say:"Escreva com suas palavras o que isso significa sobre você:",ask:AK("Ex.: que sou alguém que não termina nada",(L,v)=>{L.seta[1]=v},"a3",{loose:1,pre:L=>L.seta[1]})},
a2h:{say:"Escolha o que mais se aproxima e ajuste depois:",opts:["Que sou fraco(a) ou incapaz","Que não sou amado(a)","Que não presto","Que sou um fracasso","Que sou um peso para os outros"].map(t=>({t,do:L=>{L.seta[1]=t},go:"a2c"}))},
a2c:{say:"Ajuste com suas palavras:",ask:AK("",(L,v)=>{L.seta[1]=v},"a3",{loose:1,pre:L=>L.seta[1]})},
a3:{jump:()=>"a4"},
a3y:{say:"Em qual? Pode ser breve.",ask:AK("Ex.: na escola, quando…",(L,v)=>{L.padrao=v},"a4",{skip:"a4",eco:v=>"Anotado: “"+trunc(cl(v),90)+"”. Viu? Esse jeito de pensar se repete, e é justamente isso que vamos treinar a mudar."})},
a4:{jump:L=>isCore(L.seta[1])?"a4c":"a4q"},
a4c:{say:L=>"Chegamos à crença central: “"+pens(cl(isCore(L.seta[1])?L.seta[1]:L.seta[0]))+"”.\nQuando a resposta já é uma conclusão clara sobre você, não faz sentido descer mais. Agora vamos testar se ela é fato.",jump:()=>"a5"},
a4q:{say:"E o que mais isso diz sobre você, lá no fundo?",ask:AK("Ex.: que ninguém vai me querer",(L,v)=>{L.seta[2]=v},"a5",{loose:1,help:"a4h",pre:L=>L.seta[2]})},
a4h:{say:"Escolha o que mais se aproxima:",opts:["Que não sou amado(a)","Que não valho nada","Que sou fraco(a)","Que sou um fracasso"].map(t=>({t,do:L=>{L.seta[2]=t},go:"a5"}))},
a5:{say:"Agora imagine um amigo seu dizendo isso de si mesmo. O que você diria a ele?",ask:AK("Ex.: que ele está sendo duro demais consigo",(L,v)=>{L.amigo=v},"a6",{help:"a5h"})},
a5h:{say:"Escolha uma ideia e depois escreva com suas palavras:",opts:AMIGO.map(t=>({t,do:L=>{L.amigo=t},go:"a5c"}))},
a5c:{say:"Com suas palavras:",ask:AK("",(L,v)=>{L.amigo=v},"a6",{pre:L=>L.amigo})},
a6:{say:"Boa. O que você acabou de dizer ao seu amigo também vale para você. Vamos guardar isso.",end:1}};
SC[3]={start:"c0",
c0:{jump:()=>(onlyReal()||!sugCren().length)?"cz":"c1"},
cz:{end:1},
c1:{say:()=>{const sg=sugCren(),ls=sg.map(b=>"• "+b.replace(/\s*\([^)\s]*\s[^)]*\)/g,"")).join("\n");return sg.length==1?"Pelo que você contou (a situação, o que você faz no automático e o que concluiu sobre si), esta crença parece estar por trás:\n"+ls+"\n\nFaz sentido para você?":"Pelo que você contou (a situação, o que você faz no automático e o que concluiu sobre si), estas crenças parecem estar por trás:\n"+ls+"\n\nQual delas pesa mais para você?"},opts:()=>[...sugCren().map(b=>({t:b,do:L=>{L.cren=[b]},go:"c2"})),{t:"Nenhuma dessas",do:L=>{L.cren=[]},go:"c0n"}]},
c0n:{say:"Tudo bem. Na próxima tela você escolhe na lista completa a que mais se parece.",end:1},
c2:{say:L=>"Vamos conferir se essa é mesmo uma crença sua, e não só desta situação.\nVocê lembra de alguma outra situação, recente ou do passado, em que pensou exatamente assim como está pensando agora: “"+cl(L.cren[0]||"").replace(/\s*\([^)\s]*\s[^)]*\)/g,"")+"”?",opts:[{t:"Sim, lembro",go:"c3"},{t:"Não lembro",go:"c2n"},{t:"Não sei",go:"c2n"}]},
c3:{say:"Qual foi essa situação? Conte em uma frase.",ask:AK("Ex.: quando larguei o curso de violão",(L,v)=>{L.padrao=v},"c4",{min:5,skip:"c4",help:"c3h",helpLabel:"Não sei descrever"})},
c3h:{say:"Pense em outra época da vida. Escolha o que mais se parece e depois complete:",opts:["Na escola","No trabalho","Na minha família","Em outro relacionamento","Quando eu era criança"].map(t=>({t,do:L=>{L.padrao=t},go:"c3c"}))},
c3c:{say:"Complete com suas palavras:",ask:AK("",(L,v)=>{L.padrao=v},"c4",{min:5,pre:L=>L.padrao})},
c4:{say:"Isso mostra que não é só desta situação: é um padrão antigo, e por isso aparece sempre que algo parecido acontece. Agora ficou mais fácil enxergá-lo.",end:1},
c2n:{say:"Tudo bem. Se você não lembra de outra vez, essa talvez não seja a crença central; pode ser uma ideia só desta situação.",opts:[{t:"Quero escolher outra",do:L=>{L.cren=[]},go:"c0n"},{t:"Manter essa mesmo assim",go:"c5"}]},
c5:{say:"Combinado. Vamos medir o quanto você acredita nela.",end:1}};
SC[4]={start:"f1",
ff:{say:L=>"Releia o que você respondeu até aqui"+(L.evid.length?":\n"+L.evid.map(x=>"• "+x).join("\n"):".")+"\n\nAgora a pergunta central: o pensamento “"+pens(cl(L.seta[0]||L.sit||""))+"” realmente faz sentido? Ou é uma interpretação afetada pela crença"+(L.cren[0]?" “"+cl(L.cren[0]).replace(/\s*\([^)\s]*\s[^)]*\)/g,"")+"”":"")+"?\n\nFato = o que de fato aconteceu e qualquer pessoa confirmaria.\nInterpretação = o que a mente conclui a mais, empurrada pela crença.",opts:[{t:"Faz sentido: é fato",go:"fa"},{t:"Parte é fato, parte é interpretação",go:"fq"},{t:"É interpretação da crença",go:"fq"}]},
fa:{say:"Vamos testar com as suas próprias respostas: olhando acima, existe algum exemplo ou situação que mostra que isso nem sempre é assim?",opts:[{t:"Sim, existem exceções",go:"fq"},{t:"Não, é sempre assim",go:"fn"}]},
fn:{say:L=>(L.evid.length?"Calma. Olhe o que você mesmo(a) trouxe antes: “"+trunc(cl(L.evid[0]),90)+"”. Isso aconteceu de verdade, então “sempre” não é exato. ":"Pode ser. ")+"Mesmo assim, vale separar o que aconteceu do que a mente acrescentou: isso ajuda a ver o que é realmente seu e o que é da crença.",jump:()=>"fq"},
fq:{say:"Então, separando: o que realmente aconteceu nessa situação? Só o que dá para ver ou ouvir, o que qualquer pessoa confirmaria (o fato).",ask:AK("Ex.: meu pai levantou a voz na cozinha às 20h",(L,v)=>{L.fato=v;return INTERP.test(v)?"f0x":(semCren()?"zz":"q3")},"q3",{min:5,help:"f0h",pre:L=>L.fato})},
f0:{say:"Agora vamos separar o que aconteceu do que a mente concluiu. O que uma câmera registraria nessa situação? Só o que dá para ver ou ouvir.",ask:AK("Ex.: meu pai levantou a voz na cozinha às 20h",(L,v)=>{L.fato=v;return INTERP.test(v)?"f0x":null},"f1",{min:5,help:"f0h",pre:L=>L.fato})},
f0x:{say:"Isso parece uma conclusão (um motivo, uma intenção ou um “sempre/nunca”). Tente só o que dá para ver ou ouvir: quem fez o quê, quando.",ask:AK("Ex.: ele me chamou de feio na frente da turma",(L,v)=>{L.fato=v;return INTERP.test(v)?"f0x":(semCren()?"zz":"q3")},"q3",{min:5,help:"f0h"})},
f0h:{say:"Exemplo de fato: “Meu pai levantou a voz às 20h”. Exemplo de interpretação: “Ele me odeia”. Tente de novo com um fato.",ask:AK("",(L,v)=>{L.fato=v;return INTERP.test(v)?"f0x":(semCren()?"zz":"q3")},"q3",{min:5})},
f1:{jump:()=>isReal()?"p1":"q1"},
p1:{say:"Agora olhe para o que aconteceu com você. Esse comportamento seria inaceitável com qualquer pessoa no seu lugar?",opts:[{t:"Sim",do:L=>{L.evidA.push("Esse comportamento seria inaceitável com qualquer pessoa no meu lugar")},go:"p2"},{t:"Não sei",go:"p1b"}]},
p1b:{say:"Pense em um amigo passando por isso. Seria aceitável que o tratassem assim?",opts:[{t:"Não, não seria",do:L=>{L.evidA.push("Não seria aceitável tratar assim um amigo meu, então também não é aceitável comigo")},go:"p2"},{t:"Ainda não sei",go:"p2"}]},
p2:{say:"Isso aconteceu mais de uma vez? Existe registro, mensagem ou testemunha?",opts:[{t:"Mais de uma vez",do:L=>{L.evidA.push("Aconteceu mais de uma vez")},go:"p2a"},{t:"Foi uma vez",go:"p3"},{t:"Não sei",go:"p3"}]},
p2a:{say:"Quem viu, ou onde isso ficou registrado? Se preferir, pode pular.",ask:AK("Ex.: colegas da turma, mensagens no grupo",(L,v)=>{L.evidA.push("Registro ou testemunhas: "+v)},"p3",{min:2,skip:"p3"})},
p3:{say:"Registrado. A responsabilidade é de quem agiu: nada justifica agredir ou humilhar alguém.",jump:()=>semCren()?"fq":"q1"},
q1:{say:L=>"Vamos testar a crença: “"+cl(L.cren.filter(b=>b!=SEM)[0]||L.seta[1]||L.seta[0]||"").replace(/\s*\([^)]*\)/g,"")+"”.\n"+QA().q,opts:()=>QA().o.map(o=>({t:o.t,go:o.ev?"q1y":"q1n"}))},
q1y:{say:()=>QA().ask,ask:AK("Escreva um exemplo",(L,v)=>{L.evid.push(v);return "q1c"},"q2",{help:"q1h"})},
q1c:{say:L=>"Olhando para o que você escreveu (“"+trunc(cl(L.evid[L.evid.length-1]||""),80)+"”): isso mostra que a crença nem sempre é verdade?",opts:[{t:"Sim, mostra",go:"q2"},{t:"Não sei dizer",go:"q1d"}]},
q1d:{say:"Tente um exemplo mais claro: uma vez em que o contrário da crença aconteceu, mesmo que pequeno.",ask:AK("Ex.: uma vez em que consegui, mesmo que pouco",(L,v)=>{L.evid.push(v)},"q2",{min:5,help:"q1h"})},
q1h:{say:"Pense em algo pequeno, de qualquer época. Não precisa ser grande.",ask:AK("",(L,v)=>{L.evid.push(v)},"q2")},
q1n:{say:()=>QA().msg,jump:()=>"q2"},
q2:{jump:L=>L.amigo?"ff":"q2a"},
q2a:{say:"Se um amigo seu estivesse nessa situação e pensasse isso de si mesmo, o que você diria a ele?",ask:AK("Ex.: que ele está sendo duro demais consigo",(L,v)=>{L.amigo=v},"ff",{eco:v=>"Isso que você diria a um amigo (“"+trunc(cl(v),90)+"”) também vale para você.",help:"q2h"})},
q2h:{say:"Escolha uma ideia e depois ajuste:",opts:AMIGO.map(t=>({t,do:L=>{L.amigo=t},go:"q2c"}))},
q2c:{say:"Com suas palavras:",ask:AK("",(L,v)=>{L.amigo=v},"ff",{pre:L=>L.amigo})},
q3:{say:L=>(!semCren()&&L.fato&&cl(L.cren[0]||L.seta[1]||"")?"O fato: “"+trunc(cl(L.fato),90)+"”.\nA crença diz: “"+trunc(cl(L.cren[0]||L.seta[1]||"").replace(/\s*\[[^\]]*\]/g,"").replace(/\s*\([^)\s]*\s[^)]*\)/g,""),90)+"”.\nO fato, sozinho, prova isso?\n\n":"")+(L.evid.length?"Olha o que você mesmo trouxe:\n"+L.evid.map(x=>"• "+x).join("\n"):"Ainda não apareceram exemplos, e tudo bem.")+"\n\nLeia com atenção: essas respostas contradizem a crença?\nCom isso na mesa: a crença é 100% verdade?",opts:[{t:"Não, não é 100%",go:"zz"},{t:"Ainda acho que é",do:L=>{insMark()},go:"q3b"}]},
q3b:{say:()=>"Tudo bem sentir isso. Uma crença pode parecer verdade mesmo quando há exceções. Vamos montar juntos um pensamento mais realista.\n\n"+pareL(),opts:[{t:"Ok, vou seguir",go:"zz"}]},
zz:{say:"Anotei tudo. Vamos seguir.",do:L=>{const p=[...L.evidA,...L.evid];if(L.amigo&&!semCren())p.push("A um amigo eu diria: "+L.amigo);L.ev=p.length?p.map(x=>"• "+x).join("\n"):"Ainda não lembro de exceções, mas não tenho certeza de que isso vale sempre."},end:1}};

b0h:{say:"Escolha o que mais se parece e ajuste depois:",opts:["Eu sinto medo","Eu sinto vergonha","Eu sinto raiva","Eu me sinto triste","Eu me sinto impotente"].map(t=>({t,do:L=>{L.bp[0]=t},go:"b0c"}))},
b0c:{say:"Ajuste com suas palavras:",ask:AK("",(L,v)=>{L.bp[0]=v},"b1",{pre:L=>L.bp[0]})},
b1:{say:L=>"Segundo: o que também é verdade?"+(L.evid[0]?"\nVocê me contou: “"+cl(L.evid[0])+"”.":""),ask:AK("Ex.: já terminei coisas importantes antes",(L,v)=>{L.bp[1]=v;return jac(v,L.bp[0])>=0.8?"b1d":null},"b2",{help:"b1h",pre:L=>L.bp[1],starters:L=>L.evid.slice(0,2).map(cl)})},

b1d:{say:"Essa parte ficou igual à anterior. Tente dizer algo diferente: o que também é verdade, além do que você sente?",ask:AK("",(L,v)=>{L.bp[1]=v;return jac(v,L.bp[0])>=0.8?"b1d":null},"b2",{})},
b2d:{say:"Essa parte ficou igual a uma anterior. O jeito mais realista de pensar é diferente do que você sente e do que também é verdade. Tente de novo.",ask:AK("",(L,v)=>{L.bp[2]=v;return crLike(v,L)?"b2k":(jac(v,L.bp[0])>=0.8||jac(v,L.bp[1])>=0.8)?"b2d":null},"b3",{strict:1})},
